<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Redmine Notifier 2</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

    <h1>Redmine Notifier 2</h1>

    <div class="card">

        <label>Адрес Redmine</label>

        <input
            id="serverUrl"
            type="text"
            placeholder="https://redmine.company.ru">

        <label>API Key</label>

        <input
            id="apiKey"
            type="password"
            placeholder="Ваш API ключ">

        <div class="buttons">

            <button id="saveBtn">
                Сохранить
            </button>

            <button id="testBtn">
                Проверить соединение
            </button>

        </div>

        <p id="status"></p>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
