<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:">
    <meta name="color-scheme" content="light dark">
    <title>Redmine Companion</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="icons.css">
</head>

<body>

<div class="container">

    <header class="app-header">

        <div class="header-left">

            <div class="app-logo">
                <img src="../assets/icon.png" alt="Logo">
            </div>

         <div class="header-info">

                <div class="app-title">
                Redmine Companion
                </div>
            </div>

        </div>

        <div class="header-lang issues-switch">
            <button id="langRu" class="switch-btn active" data-lang="ru">
                RU
            </button>
            <button id="langEn" class="switch-btn" data-lang="en">
                EN
            </button>
        </div>

        <div class="header-status">

            <div id="statusTitle" class="status-title">
                -
            </div>

            <div id="statusSync" class="status-sync">
                <span data-i18n="header.lastSync">Последняя синхронизация:</span> —
            </div>

        </div>

    </header>

    <nav class="tabs">

        <button class="tab active" data-page="overview" data-i18n="tabs.overview">
            Обзор
        </button>

        <button class="tab" data-page="issues" data-i18n="tabs.issues">
            Мои задачи
        </button>

        <button class="tab" data-page="journal" data-i18n="tabs.journal">
            Журнал
        </button>

        <button class="tab" data-page="settings" data-i18n="tabs.settings">
            Настройки
        </button>

    </nav>

    <!-- =================== ОБЗОР =================== -->

    <div id="overviewPage" class="page">
        
        <div id="dashboard" class="dashboard">

            <div class="dashboard-card">

                <div class="dashboard-icon">
                    <span class="icon ico ico-person" aria-hidden="true"></span>
                </div>

                <div class="dashboard-name" data-i18n="dashboard.assigned">
                    Назначено
                </div>

                <div id="assignedCount"
                    class="dashboard-value">
                    0
                </div>

            </div>

            <div class="dashboard-card">

                <div class="dashboard-icon">
                    <span class="icon ico ico-edit" aria-hidden="true"></span>
                </div>

                <div class="dashboard-name" data-i18n="dashboard.authored">
                    Создано
                </div>

                <div id="authoredCount"
                    class="dashboard-value">
                    0
                </div>

            </div>

            <div class="dashboard-card">

                <div class="dashboard-icon">
                    <span class="icon ico ico-eye" aria-hidden="true"></span>
                </div>

                <div class="dashboard-name" data-i18n="dashboard.watched">
                    Под наблюдением
                </div>

                <div id="watchedCount"
                    class="dashboard-value">
                    0
                </div>

            </div>

            <div class="dashboard-card">

                <div class="dashboard-icon">
                    <span class="icon ico ico-book" aria-hidden="true"></span>
                </div>

                <div class="dashboard-name" data-i18n="dashboard.total">
                    Всего
                </div>

                <div id="allCount"
                    class="dashboard-value">
                    0
                </div>

            </div>

        </div>

    </div>

    <!-- =================== МОИ ЗАДАЧИ =================== -->

    <div id="issuesPage" class="page" hidden>
        <div class="issues-toolbar">

            <input
                id="issuesSearch"
                type="text"
                class="issues-search-input"
                placeholder="Поиск по задачам..."
                data-i18n-placeholder="issues.searchPlaceholder">

            <div class="issues-switch">
                <button id="filterActive" class="switch-btn active" data-i18n="issues.filterActive">
                    Активные
                </button>

                <button id="filterAll" class="switch-btn" data-i18n="issues.filterAll">
                    Все
                </button>
            </div>

            <select id="issuesSort" class="issues-sort-select">
                <option value="updated_desc" data-i18n="issues.sortUpdated">По дате обновления</option>
                <option value="priority_desc" data-i18n="issues.sortPriority">По приоритету</option>
                <option value="due_asc" data-i18n="issues.sortDue">По сроку</option>
                <option value="id_desc" data-i18n="issues.sortIdDesc">По номеру (убыв.)</option>
                <option value="id_asc" data-i18n="issues.sortIdAsc">По номеру (возр.)</option>
            </select>

        </div>

        <div class="issues-filters">

            <select id="issuesProject" class="issues-sort-select"></select>

            <select id="issuesTracker" class="issues-sort-select"></select>

            <select id="issuesStatus" class="issues-sort-select"></select>

            <button id="issuesReset" type="button" class="issues-reset-btn" data-i18n="issues.resetFilters">
                Сбросить
            </button>

        </div>

        <div class="issues-section">

            <div class="issues-header" data-target="assignedList">

                <span class="issues-title" data-i18n="issues.assignedToMe">
                    Назначены мне
                </span>

                <div class="issues-header-right">

                    <span class="issues-count" id="assignedTotal">
                        0
                    </span>

                    <span class="arrow">
                        <span class="ico ico-chevron-down" aria-hidden="true"></span>
                    </span>

                </div>

            </div>
            <div id="assignedList" class="issues-list"></div>

        </div>

        <div class="issues-section">

            <div class="issues-header" data-target="authoredList">

                <span class="issues-title" data-i18n="issues.createdByMe">
                    Созданы мной
                </span>

                <div class="issues-header-right">

                    <span class="issues-count" id="authoredTotal">
                        0
                    </span>

                    <span class="arrow">
                        <span class="ico ico-chevron-down" aria-hidden="true"></span>
                    </span>

                </div>

            </div>

            <div id="authoredList" class="issues-list" hidden></div>

        </div>

        <div class="issues-section">

            <div class="issues-header" data-target="watchedList">

                <span class="issues-title" data-i18n="issues.watched">
                    Под наблюдением
                </span>

                <div class="issues-header-right">

                    <span class="issues-count" id="watchedTotal">
                        0
                    </span>

                    <span class="arrow">
                        <span class="ico ico-chevron-down" aria-hidden="true"></span>
                    </span>

                </div>

            </div>

            <div id="watchedList" class="issues-list" hidden></div>

        </div>

    </div>

    <!-- =================== ЖУРНАЛ =================== -->

    <div id="journalPage" class="page" hidden>

        <div class="journal-header">
            <h2><span class="icon ico ico-book" aria-hidden="true"></span> <span data-i18n="journal.title">Журнал</span></h2>
            <button
                id="clearJournalBtn"
                class="icon-button"
                title="Очистить журнал"
                data-i18n-title="journal.clearTooltip">
                <span class="icon ico ico-trash" aria-hidden="true"></span>
            </button>    
        </div>
        <div id="journalList"></div>

    </div>

    <!-- =================== НАСТРОЙКИ =================== -->

    <div id="settingsPage" class="page" hidden>
        <div class="settings-panel">

            <label data-i18n="settings.profile">Профиль (сервер Redmine)</label>

            <div class="profile-row">

                <select id="profileSelect"></select>

                <button id="profileNewBtn" type="button" class="icon-button"
                        data-i18n-title="settings.profileNew" title="Новый профиль">
                    <span class="ico ico-add" aria-hidden="true"></span>
                </button>

                <button id="profileRemoveBtn" type="button" class="icon-button"
                        data-i18n-title="settings.profileRemove" title="Удалить профиль">
                    <span class="ico ico-trash" aria-hidden="true"></span>
                </button>

            </div>

            <label data-i18n="settings.profileName">Название профиля</label>

            <input id="profileName" type="text" maxlength="60">

            <label data-i18n="settings.serverUrl">Адрес Redmine</label>

            <input
                    id="serverUrl"
                    type="text"
                    placeholder="https://redmine.company.ru"
                    data-i18n-placeholder="settings.serverUrlPlaceholder">

            <label data-i18n="settings.apiKey">API Key</label>

            <input
                    id="apiKey"
                    type="password"
                    placeholder="Ваш API Key"
                    data-i18n-placeholder="settings.apiKeyPlaceholder">

            <label class="settings-checkbox">
                <input type="checkbox" id="allowSelfSigned">
                <span data-i18n="settings.allowSelfSigned">Доверять самоподписанному сертификату</span>
            </label>

            <label for="proxyUrl" data-i18n="settings.proxy">Прокси (необязательно)</label>

            <input
                    id="proxyUrl"
                    type="text"
                    placeholder="http://host:3128"
                    data-i18n-placeholder="settings.proxyPlaceholder">

            <div class="buttons">

                <button id="saveBtn" class="primary-button" data-i18n="settings.save">
                    Сохранить
                </button>

                <button id="testBtn" class="primary-button" data-i18n="settings.sync">
                    Синхронизировать
                </button>

            </div>

            <div class="settings-divider"></div>

            <div class="settings-row">
                <label for="pollInterval" data-i18n="settings.pollInterval">
                Синхронизация
                </label>

                <select id="pollInterval">

                    <option value="30" data-i18n="settings.interval30">
                        30 секунд
                    </option>

                    <option value="60" data-i18n="settings.interval60">
                        1 минута
                    </option>

                    <option value="120" data-i18n="settings.interval120">
                        2 минуты
                    </option>

                    <option value="300" data-i18n="settings.interval300">
                        5 минут
                    </option>

                    <option value="600" data-i18n="settings.interval600">
                        10 минут
                    </option>

                </select>
            </div>

            <div class="settings-row">
                <label for="maxIssues" data-i18n="settings.maxIssues">
                Максимум задач в списке
                </label>

                <select id="maxIssues">
                    <option value="200">200</option>
                    <option value="500">500</option>
                    <option value="1000">1000</option>
                </select>
            </div>

            <div class="settings-row">
                <label for="themeSelect" data-i18n="settings.theme">
                Тема оформления
                </label>

                <select id="themeSelect">
                    <option value="system" data-i18n="settings.themeSystem">Как в системе</option>
                    <option value="light" data-i18n="settings.themeLight">Светлая</option>
                    <option value="dark" data-i18n="settings.themeDark">Тёмная</option>
                </select>
            </div>

            <label class="settings-checkbox">
                <input type="checkbox" id="startWithWindows">
                <span data-i18n="settings.startWithWindows">Запускать вместе с Windows</span>
            </label>

            <label class="settings-checkbox">
                <input type="checkbox" id="startMinimized">
                <span data-i18n="settings.startMinimized">Запускать свернутым</span>
            </label>

            <div class="settings-divider"></div>

            <div class="settings-heading">
                <span class="ico ico-bell-off" aria-hidden="true"></span>
                <span data-i18n="settings.notifications">Уведомления</span>
            </div>

            <label class="settings-checkbox">
                <input type="checkbox" id="dnd">
                <span data-i18n="settings.dnd">Не беспокоить (без всплывающих окон)</span>
            </label>

            <div class="settings-quiet">

                <label class="settings-checkbox">
                    <input type="checkbox" id="quietEnabled">
                    <span data-i18n="settings.quietHours">Тихие часы</span>
                </label>

                <span data-i18n="settings.quietFrom">с</span>
                <input type="time" id="quietFrom">

                <span data-i18n="settings.quietTo">до</span>
                <input type="time" id="quietTo">

            </div>

            <label data-i18n="settings.events">О чём уведомлять</label>

            <div class="settings-events">

                <label class="settings-checkbox">
                    <input type="checkbox" data-notify="new">
                    <span data-i18n="settings.eventNew">Новые задачи</span>
                </label>

                <label class="settings-checkbox">
                    <input type="checkbox" data-notify="comment">
                    <span data-i18n="settings.eventComment">Комментарии</span>
                </label>

                <label class="settings-checkbox">
                    <input type="checkbox" data-notify="status">
                    <span data-i18n="settings.eventStatus">Смена статуса</span>
                </label>

                <label class="settings-checkbox">
                    <input type="checkbox" data-notify="assigned">
                    <span data-i18n="settings.eventAssigned">Смена исполнителя</span>
                </label>

                <label class="settings-checkbox">
                    <input type="checkbox" data-notify="priority">
                    <span data-i18n="settings.eventPriority">Смена приоритета</span>
                </label>

                <label class="settings-checkbox">
                    <input type="checkbox" data-notify="due">
                    <span data-i18n="settings.eventDue">Смена срока</span>
                </label>

            </div>

            <div class="settings-divider"></div>

            <div id="statusCard" class="status-card">

                <div class="status-avatar">

                    <span class="icon ico ico-person" aria-hidden="true"></span>

                </div>

                <div class="status-content">

                    <div id="statusUserName" class="status-user-name">
                        —
                    </div>

                    <div id="statusUserInfo" class="status-user-info" data-i18n="common.noData">
                        Нет данных
                    </div>
                </div>
            </div>

            <div class="settings-version">
                <span data-i18n="settings.version">Версия</span>
                <span id="appVersion"></span>
            </div>
        </div>
    </div>  
</div>

<script src="../locales/ru.js"></script>
<script src="../locales/en.js"></script>
<script src="services/I18nService.js"></script>
<script src="services/HtmlUtils.js"></script>
<script src="SyncService.js"></script>
<script src="services/ErrorUtils.js"></script>
<script src="services/Icon.js"></script>
<script src="services/IssueMeta.js"></script>
<script src="services/TimeUtils.js"></script>
<script src="services/TimerService.js"></script>
<script src="services/NotificationPolicy.js"></script>
<script src="services/IssueRenderer.js"></script>
<script src="services/JournalService.js"></script>
<script src="services/CompareService.js"></script>
<script src="services/CommentService.js"></script>
<script src="services/HistoryService.js"></script>
<script src="services/NotificationBuilder.js"></script>
<script src="services/IssueFilterService.js"></script>
<script src="services/IssueSearchService.js"></script>
<script src="Apps.js"></script>
<script src="app.js"></script>

</body>
</html>
